name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, the request or the screen. No tokens or passwords.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (package or commit)
  - type: textarea
    id: logs
    attributes:
      label: Output or screenshots

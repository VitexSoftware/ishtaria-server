[package]
name = "ishtaria-server"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Authoritative world server of Ishtaria – a federated, persistent virtual planet."
repository = "https://github.com/VitexSoftware/ishtaria-server"
authors = ["Vítězslav Dvořák <cybervitexus@gmail.com>"]
rust-version = "1.80"

[dependencies]
anyhow = "1"
argon2 = "0.5.3"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hmac = "0.12"
image = { version = "=0.25.5", default-features = false, features = ["pnm", "png"] }
ishtaria-core = { git = "https://github.com/VitexSoftware/ishtaria-core", branch = "main" }
parry2d-f64 = "0.17.6"
parry3d-f64 = "0.17.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
